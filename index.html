const deliverableLabel=item=>`${item.agent_task_ids?.length?item.agent_task_ids.join("/"):item.id} · ${b(item.name)}`;
const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined&&text!==null)node.textContent=String(text);if(cls)node.className=cls;return node;};
const target=id=>document.getElementById(id);
const add=(parent,tag,text,cls)=>parent.appendChild(el(tag,text,cls));
const clear=id=>target(id).replaceChildren();
const labelBlock=id=>blockNames[id]?.[language==="zh"?0:1]||t("unconfirmed");
function observationCurrent(now=Date.now()){
 const value=data.agent_observation;if(!value.observed_at||value.status!=="current_observation")return false;
 const age=(now-Date.parse(value.observed_at))/1000;
 return Number.isFinite(age)&&age>=0&&Number.isFinite(value.max_age_seconds)&&age<=value.max_age_seconds;
}
function localToday(now=new Date()){
 const parts=new Intl.DateTimeFormat("en-CA",{timeZone:data.daily_timezone,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(now);
 return ["year","month","day"].map(kind=>parts.find(p=>p.type===kind).value).join("-");
}
function dateLabel(value){return new Intl.DateTimeFormat(language==="zh"?"zh-CN":"en-GB",{timeZone:"UTC",month:"short",day:"numeric"}).format(new Date(value+"T00:00:00Z"));}
function displayTime(value){if(!value)return t("unknown");const date=new Date(value);if(Number.isNaN(date.getTime()))return t("unknown");return new Intl.DateTimeFormat(language==="zh"?"zh-CN":"en-GB",{timeZone:data.daily_timezone,dateStyle:"short",timeStyle:"medium",hour12:false}).format(date)+" ("+data.daily_timezone+")";}
function renderStageGantt(view,id,name){const section=el("section",null,"stage-gantt-section");section.id="stage-gantt-"+id;add(section,"h3",name[language==="zh"?0:1]);add(section,"p",`${view.completed}/${view.total} ${language==="zh"?"完成":"complete"}`,"caption");const list=el("div",null,"stage-gantt");view.tasks.forEach(task=>{const state=task.status==="completed"?"complete":task.status==="running"?"partial":"not-started";const row=el("div",null,"stage-gantt-row "+state);const track=el("div",null,"stage-gantt-track");const bar=el("div",null,"gantt-bar "+state);const percent=task.status==="completed"?100:0;bar.style.width=`${percent}%`;bar.setAttribute("aria-label",`${task.id} · ${task.title} · ${taskStatusLabel(task.status)} · ${percent}%`);const fill=el("span",null,"gantt-fill");fill.style.width=`${percent}%`;const value=el("span",`${percent}%`,"gantt-value");bar.append(fill,value);track.appendChild(bar);row.append(el("div",`${task.id} · ${task.title}`,"stage-gantt-label"),track);list.appendChild(row);});section.appendChild(list);target("gantt").appendChild(section);}
function renderGantt(){
 clear("progress-summary");clear("gantt");const model=data.construction;
 if(!model.blocks.length){add(target("gantt"),"p",t("planUnavailable"),"empty");return;}
 const legend=el("div",null,"gantt-legend");
 [["complete",t("completeLegend")],["partial",t("partialLegend")],["not-started",t("notStartedLegend")]].forEach(([cls,label])=>{const item=el("span",null,"legend-item");item.append(el("i",null,cls),el("span",label));legend.appendChild(item);});
 add(legend,"span",`${model.percent}% · ${b(model.basis)}${model.reviewed?"":" · "+t("reviewPending")}`,"legend-basis");
 [["agent-completed",language==="zh"?"任务记录完成":"Recorded task complete"],["agent-running",language==="zh"?"任务记录进行中":"Recorded task in progress"],["agent-ready",language==="zh"?"Agent待领取":"Agent ready"],["agent-blocked",language==="zh"?"Agent阻塞/失败":"Agent blocked/failed"]].forEach(([cls,label])=>{const item=el("span",null,"legend-item");item.append(el("i",null,cls),el("span",label));legend.appendChild(item);});
 target("progress-summary").appendChild(legend);
 const start=Math.min(...model.deliverables.map(v=>Date.parse(v.estimated_start))),end=Math.max(...model.deliverables.map(v=>Date.parse(v.estimated_end)))+86400000;
 const today=localToday();const point=Date.parse(today),position=100*(point-start)/(end-start);
 const chart=el("div",null,"gantt-chart");const head=el("div",null,"gantt-head");add(head,"div",language==="zh"?"任务":"Task","gantt-name-head");const axis=el("div",null,"gantt-axis");
 [0,.25,.5,.75,1].forEach(f=>{const tick=el("span",dateLabel(new Date(start+(end-start)*f).toISOString().slice(0,10)));tick.style.left=`${f*100}%`;axis.appendChild(tick);});head.appendChild(axis);chart.appendChild(head);
 const todayLine=el("div",null,"gantt-today");todayLine.style.left=`calc(var(--gantt-label) + (100% - var(--gantt-label)) * ${Math.max(0,Math.min(100,position))/100})`;todayLine.title=`${t("today")} ${today}`;todayLine.setAttribute("aria-label",todayLine.title);chart.appendChild(todayLine);
 model.blocks.forEach(block=>{const group=el("div",null,"gantt-group"+(block.id===model.current_block?" active":""));add(group,"div",labelBlock(block.id),"gantt-group-title");chart.appendChild(group);
 model.deliverables.filter(item=>item.block===block.id).forEach(item=>{const percent=item.agent_percent??item.percent;const state=percent===100?"complete":percent===0?"not-started":"partial";const agentState=item.agent_status||"unknown";const row=el("div",null,"gantt-row "+state+" agent-"+agentState);const title=el("div",null,"gantt-label");title.title=deliverableLabel(item);title.append(el("i",null,"agent-marker agent-"+agentState),el("span",deliverableLabel(item))); 
 const track=el("div",null,"gantt-track");const bar=el("div",null,"gantt-bar "+state);bar.style.left=`${100*(Date.parse(item.estimated_start)-start)/(end-start)}%`;bar.style.width=`${100*(Date.parse(item.estimated_end)+86400000-Date.parse(item.estimated_start))/(end-start)}%`;bar.title=`${deliverableLabel(item)} · ${dateLabel(item.estimated_start)} – ${dateLabel(item.estimated_end)} · ${item.estimated_workdays} ${t("workdays")} · ${percent}%`;bar.setAttribute("aria-label",bar.title);const fill=el("span",null,"gantt-fill");fill.style.width=`${percent}%`;const value=el("span",`${percent}%`,"gantt-value");bar.append(fill,value);track.appendChild(bar);row.append(title,track);chart.appendChild(row);});});
 const scroll=el("div",null,"gantt-scroll");scroll.appendChild(chart);target("gantt").appendChild(scroll);if(position<0||position>100)add(target("gantt"),"p",t("outside"),"caption");
 const stageViews=Object.fromEntries((data.stage_views||[]).map(view=>[view.id,view]));stages.filter(([id])=>id!==model.current_stage).forEach(([id,name])=>{if(stageViews[id]?.tasks?.length)renderStageGantt(stageViews[id],id,name);});
}
function renderStages(){clear("stages");const views=Object.fromEntries((data.stage_views||[]).map(view=>[view.id,view]));stages.forEach(([id,name])=>{const view=views[id]||{tasks:[],total:0,completed:0,ready:0};const open=selectedStage===id||(!selectedStage&&id===data.construction.current_stage);const row=el("div",null,"stage"+(id===data.construction.current_stage?" current":"")+(open?" expanded":""));const button=el("button",null,"stage-button");add(button,"strong",name[language==="zh"?0:1]);add(button,"small",`${view.completed}/${view.total} ${language==="zh"?"完成":"complete"} · ${view.ready} ${language==="zh"?"待领取":"ready"}`);button.setAttribute("aria-expanded",String(open));button.addEventListener("click",()=>{selectedStage=selectedStage===id?null:id;renderStages();renderGantt();});row.appendChild(button);if(open){if(id===data.construction.current_stage){add(row,"small",t("focus")+" · "+labelBlock(data.construction.current_block));["A","B","C"].forEach(block=>add(row,"div",labelBlock(block),"subphase"+(block===data.construction.current_block?" selected":"")));}const list=el("div",null,"stage-task-list");view.tasks.forEach(task=>{const line=el("div",null,"stage-task");add(line,"span",`${task.id} · ${task.title}`,"stage-task-id");add(line,"span",taskStatusLabel(task.status),"stage-task-status "+task.status);list.appendChild(line);});row.appendChild(list);}target("stages").appendChild(row);});add(target("stages"),"p",language==="zh"?"点击阶段查看对应甘特图；再次点击收起并恢复当前阶段。":"Click a stage to view its Gantt; click again to collapse and restore the current stage.","caption");}
function renderTasks(){clear("task-rows");const filter=target("filter").value.toLowerCase();data.task_views.filter(task=>b(task.purpose).toLowerCase().includes(filter)).forEach(task=>{const row=el("tr");add(row,"td",b(task.purpose));add(row,"td",labelBlock(task.block));add(row,"td",t(task.priority));add(row,"td",b(task.status_text));target("task-rows").appendChild(row);});}
function renderRoles(){clear("roles");const current=observationCurrent();data.roles.forEach(role=>{const row=el("article",null,"role-item");add(row,"h3",b(role.name));add(row,"p",b(role.responsibility));add(row,"span",t(current&&role.id!=="visualization"?role.state==="unconfirmed"?"activityUnconfirmed":role.state:"activityUnconfirmed"),"role-state"+(current&&role.state==="working"?" working":""));target("roles").appendChild(row);});
 const observed=data.agent_observation.observed_at;const age=observed?Math.floor((Date.now()-Date.parse(observed))/1000):null;target("observed-at").textContent=`${t("observed")}: ${observed||t("unknown")} · ${t("viewAge")}: ${age===null?t("unknown"):age+" "+t("seconds")}`;
}
function copyFeedback(text,parent){const box=el("textarea");box.value=text;box.readOnly=true;box.setAttribute("aria-label",t("manualCopy"));parent.appendChild(box);box.focus();box.select();const notice=el("p",t("manualCopy"),"caption");parent.appendChild(notice);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>{notice.textContent=t("copied");}).catch(()=>{});}
function renderDecisions(){clear("decisions");if(!data.decisions.length)add(target("decisions"),"p",t(data.source.status==="unavailable"?"decisionUnknown":"noDecisions"),"empty");data.decisions.forEach(decision=>{const row=el("article",null,"decision");add(row,"h3",b(decision.title));add(row,"p",t("effect")+": "+b(decision.effect));add(row,"p",t("recommendation")+": "+b(decision.recommendation));const button=el("button",t("copy"),"action");button.addEventListener("click",()=>copyFeedback(b(decision.feedback)+"\n"+decision.issue_id,row));row.appendChild(button);target("decisions").appendChild(row);});}
function renderAudit(){clear("audit");add(target("audit"),"p",t("history"),"caption");add(target("audit"),"p",`${t("planVersion")}: ${data.construction.version||t("unknown")}`);data.tasks.forEach(task=>{const record=el("details");add(record,"summary",task.id+" · "+task.status);add(record,"p",task.checkpoint);task.history.forEach(event=>add(record,"p",(event.at||t("unknown"))+" · "+event.summary));target("audit").appendChild(record);});}
function switchTab(name){workspace=name;["project","backtests","live"].forEach(id=>{target(id).hidden=id!==name;target("tab-"+id).setAttribute("aria-selected",String(id===name));target("tab-"+id).tabIndex=id===name?0:-1;});}
function renderAll(){document.documentElement.lang=language==="zh"?"zh-CN":"en";document.title="MultiStrat · "+t("title");document.querySelectorAll("[data-i18n]").forEach(node=>node.textContent=t(node.dataset.i18n));target("filter").placeholder=t("filter");target("filter").setAttribute("aria-label",t("filter"));["zh","en"].forEach(lang=>target("lang-"+lang).setAttribute("aria-pressed",String(lang===language)));
 clear("snapshot-time");[["snapshot",data.generated_at],["sourceUpdated",data.source.modified_at],["checkpoint",data.source.last_checkpoint_at]].forEach(([key,value])=>add(target("snapshot-time"),"div",t(key)+" · "+displayTime(value)));
 const now=Date.now(),sourceAge=data.source.modified_at?(now-Date.parse(data.source.modified_at))/1000:null;target("health").textContent=t(data.source.status==="unavailable"?"unavailable":sourceAge===null||sourceAge<0||sourceAge>data.source.stale_limit_seconds?"stale":"fresh")+"。 "+t("sourceNotice");
 clear("current-body");const current=data.task_views.find(task=>task.id===data.current_task);if(current){add(target("current-body"),"h3",b(current.purpose),"current-title");add(target("current-body"),"span",b(current.status_text),"pill running");add(target("current-body"),"p",t("benefit")+": "+b(current.benefit));add(target("current-body"),"p",t("next")+": "+b(current.next));}else add(target("current-body"),"p",t("noCurrent"),"empty");
 renderGantt();renderStages();renderTasks();renderRoles();renderDecisions();renderAudit();clear("footer");add(target("footer"),"p",(language==="zh"?"可视化为辅助能力；没有独立 Agent 活跃观测":"Visualization is an auxiliary capability; no independent activity observation"));add(target("footer"),"p",t("offline"));switchTab(workspace);
}
["zh","en"].forEach(lang=>target("lang-"+lang).addEventListener("click",()=>{language=lang;renderAll();}));
["project","backtests","live"].forEach((name,index)=>{target("tab-"+name).addEventListener("click",()=>switchTab(name));target("tab-"+name).addEventListener("keydown",event=>{if(event.key==="ArrowRight"||event.key==="ArrowLeft"){event.preventDefault();const ids=["project","backtests","live"],next=ids[(index+(event.key==="ArrowRight"?1:2))%3];switchTab(next);target("tab-"+next).focus();}});});
target("filter").addEventListener("input",renderTasks);renderAll();


// The journey is one vertically scrollable surface. The stage rail only
// locates a section; it has no independent expansion state to get stuck.
function renderStages(){clear("stages");const views=Object.fromEntries((data.stage_views||[]).map(view=>[view.id,view]));stages.forEach(([id,name])=>{const view=views[id]||{total:0,completed:0,ready:0};const row=el("div",null,"stage"+(id===data.construction.current_stage?" current":""));const button=el("button",null,"stage-button");add(button,"strong",name[language==="zh"?0:1]);add(button,"small",`${view.completed}/${view.total} ${language==="zh"?"完成":"complete"} · ${view.ready} ${language==="zh"?"待领取":"ready"}`);button.setAttribute("aria-expanded","false");button.addEventListener("click",()=>document.getElementById("stage-gantt-"+id)?.scrollIntoView({behavior:"smooth",block:"start"}));row.appendChild(button);target("stages").appendChild(row);});add(target("stages"),"p",language==="zh"?"点击阶段定位到左侧对应甘特图；左侧内容可直接上下滚动。":"Click a stage to locate its Gantt on the left; scroll the full journey directly.","caption");}
</script></body></html>
