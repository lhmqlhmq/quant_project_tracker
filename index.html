<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="multistrat-console-version" content="multistrat-console-v3">
<title>MultiStrat · 项目控制台</title><style>
:root{color-scheme:dark;--bg:#0d121b;--panel:#151d29;--line:#283445;--text:#e7eef6;--muted:#98a8ba;--accent:#5de0c1}*{box-sizing:border-box}body{margin:0;font:14px/1.65 system-ui,sans-serif;background:var(--bg);color:var(--text)}a{color:var(--accent)}button,input,select{font:inherit}button,select,input{background:#1d2837;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.shell{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}aside{padding:28px 20px;border-right:1px solid var(--line);background:#101823}aside strong{font-size:22px}aside nav{display:grid;gap:8px;margin:36px 0}aside nav a{text-decoration:none;color:var(--muted);padding:10px;border-radius:8px}aside nav a:hover{background:var(--panel);color:var(--text)}.small{font-size:12px;color:var(--muted)}main{width:100%;max-width:1440px;margin:auto;padding:32px 36px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 16px}h3{font-size:15px;margin:0 0 10px}p{margin:8px 0}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:2px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metric b{display:block;font-size:30px;margin-top:6px}.metric span{color:var(--muted)}.split{display:grid;grid-template-columns:2fr 1fr;gap:20px}.track{height:9px;background:#273443;border-radius:6px;overflow:hidden;margin:14px 0}.track i{display:block;height:100%;background:var(--accent)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.column{background:#101823;padding:14px;border-radius:10px;min-height:140px}.task{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;margin:10px 0;overflow-wrap:anywhere}.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:12px;color:var(--muted)}.done{color:var(--accent)}.blocked{color:#ffad9e}.agents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.agent{background:#101823;border:1px solid var(--line);padding:18px;border-radius:10px}.avatar{width:38px;height:38px;display:inline-grid;place-items:center;background:#244b49;color:var(--accent);border-radius:12px;margin-right:10px;font-weight:700}.agent p{color:var(--muted)}.role-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}.record{padding:12px 0;border-bottom:1px solid var(--line)}footer{color:var(--muted);font-size:12px;margin:25px 0}#empty{color:var(--muted)}@media(max-width:1050px){.shell{grid-template-columns:180px minmax(0,1fr)}main{padding:24px}.split{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.shell{display:block}aside{padding:16px;border-right:0;border-bottom:1px solid var(--line)}aside nav{display:flex;margin:12px 0;flex-wrap:wrap}aside .small{display:none}main{padding:18px}header{align-items:flex-start}h1{font-size:22px}.board,.agents{grid-template-columns:1fr}.panel{padding:16px}.toolbar input{width:100%}}
</style></head><body><div class="shell"><aside><strong>MultiStrat<span style="color:var(--accent)">.</span></strong><p class="small" id="sideLabel"></p><nav><a href="#overview" id="navOverview"></a><a href="#work" id="navWork"></a><a href="#roles" id="navRoles"></a><a href="#records" id="navRecords"></a></nav><p class="small">multistrat-cloud-2026-10-06</p><p class="small">Console v3</p></aside><main><header><div><div class="eyebrow">PROJECT WORKSPACE</div><h1 id="heading"></h1><p class="small" id="updated"></p></div><button id="language" aria-label="Switch language">EN</button></header>
<section id="overview"><div class="metrics" id="metrics"></div><div class="split"><div class="panel"><h2 id="scopeTitle"></h2><p id="scope"></p><div class="track"><i id="completion"></i></div><p class="small" id="completionText"></p></div><div class="panel"><h2 id="attentionTitle"></h2><div id="attention"></div></div></div></section>
<section id="work" class="panel"><h2 id="workTitle"></h2><div class="toolbar"><input id="search" type="search"><select id="statusFilter" aria-label="Task status"></select></div><div class="board" id="board"></div><p id="empty" hidden></p></section>
<section id="roles" class="panel"><h2 id="rolesTitle"></h2><p id="roleNotice" class="small"></p><div class="agents" id="agents"></div></section>
<section id="records" class="panel"><h2 id="recordsTitle"></h2><div id="recordList"></div></section><footer id="footer"></footer></main></div>
<script>const snapshot={"title":"MultiStrat Cloud · Project Progress","projectKey":"multistrat-cloud-2026-10-06","startedAt":"2026-10-06","updatedAt":"2026-10-14","tasks":[{"id":"cloud-dashboard","labels":{"en":"Integrate project dashboard","zh":"整合项目看板"},"status":"done"},{"id":"cloud-pages","labels":{"en":"Publish public dashboard","zh":"发布公开看板"},"status":"done"},{"id":"cloud-agent-alignment","labels":{"en":"Align four project Agent roles","zh":"对齐四个项目 Agent 角色"},"status":"done"},{"id":"cloud-role-verification","labels":{"en":"Verify native roles in cloud","zh":"核实云端原生角色加载"},"status":"todo"},{"id":"cloud-data-isolation","labels":{"en":"Restrict dashboard to current cloud project","zh":"限定看板只展示当前云项目"},"status":"done"},{"id":"cloud-console-unification","labels":{"zh":"统一控制台与发布来源","en":"Unify console and release source"},"status":"in_progress"}],"agents":[{"id":"coordinator","labels":{"en":"Emma · Coordinator and requirements owner","zh":"Emma（艾玛）· 主协调与需求负责人","scopeEn":"Clarify requirements, define acceptance, route work, consolidate findings and schedule cloud operations.","scopeZh":"澄清需求、定义验收、路由任务、汇总审核、统一安排云操作。"},"status":"unknown","taskIds":["cloud-dashboard","cloud-pages","cloud-agent-alignment","cloud-role-verification","cloud-data-isolation"]},{"id":"implementer","labels":{"en":"Ethan · Code implementation and fixes","zh":"Ethan（伊森）· 代码实现与修复","scopeEn":"Modify assigned files, run relevant verification and fix independent reviewer findings; no cloud operations or release approval.","scopeZh":"修改分配文件、验证实现、修复独立审核问题；不自行运行云回测或批准上线。"},"status":"unknown","taskIds":["cloud-role-verification"]},{"id":"code_reviewer","labels":{"en":"Liam · Independent code review","zh":"Liam（利亚姆）· 独立代码审核","scopeEn":"Read-only requirements, logic, interfaces, edge cases, bugs and regression review of a fixed version.","scopeZh":"只读审核固定版本的需求符合性、逻辑、接口、边界、bug 与回归风险。"},"status":"unknown","taskIds":["cloud-role-verification"]},{"id":"research_validator","labels":{"en":"Ella · Research risk and validation","zh":"Ella（艾拉）· 研究风险与验证","scopeEn":"Read-only causality/future-data leakage, overfitting, costs, risk constraints and evidence review; cannot approve Paper/Live.","scopeZh":"只读检查未来数据泄漏、因果性、过拟合、成本、风险约束与证据；不批准 Paper/Live。"},"status":"unknown","taskIds":["cloud-role-verification"]}],"consoleVersion":"multistrat-console-v3"};
const text={zh:{heading:'当前项目控制台',sideLabel:'项目进度与协作',overview:'项目概览',work:'工作看板',roles:'Agent 分工与状态',records:'当前记录',updated:'记录更新',total:'工作包',done:'已完成',open:'待处理',agents:'已确认角色',scopeTitle:'当前项目范围',scope:'仅包含 2026-10-06 起在当前项目确认的工作记录。下方完成比例用于已登记的工作包，不代表整个交易系统的完成率。',attention:'待核实与下一步',completion:'已登记工作包完成',roleNotice:'角色职责已经确认；独立运行状态尚无验证记录。工作分配表示职责绑定，不表示 Agent 正在运行。',search:'搜索当前工作包',all:'全部状态',todo:'待办',in_progress:'进行中',blocked:'阻塞',doneStatus:'完成',unknown:'待核实',idle:'待命',unassigned:'未分配',empty:'没有匹配的当前项目工作包',tasks:'关联工作包',none:'暂无工作分配',recordNote:'当前快照中的工作状态；不使用历史迁移数据。',footer:'MultiStrat · 当前项目记录 · Console v3'},en:{heading:'Current project console',sideLabel:'Progress & collaboration',overview:'Overview',work:'Work board',roles:'Agent roles & status',records:'Current records',updated:'Records updated',total:'Work packages',done:'Completed',open:'Open',agents:'Confirmed roles',scopeTitle:'Project scope',scope:'Only work confirmed for this project since 2026-10-06. Completion refers to registered work packages, not the entire trading system.',attention:'Verification & next steps',completion:'registered work packages completed',roleNotice:'Responsibilities are confirmed; independent runtime has not been verified. Assignment does not imply an Agent is running.',search:'Search current work packages',all:'All statuses',todo:'Todo',in_progress:'In progress',blocked:'Blocked',doneStatus:'Done',unknown:'Needs verification',idle:'Idle',unassigned:'Unassigned',empty:'No matching current-project work packages',tasks:'Assigned work',none:'No work assigned',recordNote:'Work status from the current snapshot; no migrated history is used.',footer:'MultiStrat · Current project records · Console v3'}};
let lang='zh';const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const status=s=>s==='done'?text[lang].doneStatus:(text[lang][s]||text[lang].unknown);const label=t=>t.labels[lang];const put=(id,s)=>document.getElementById(id).textContent=s;
function board(){const query=document.getElementById('search').value.toLowerCase();const filter=document.getElementById('statusFilter').value;const tasks=snapshot.tasks.filter(t=>label(t).toLowerCase().includes(query)&&(!filter||t.status===filter));document.getElementById('board').innerHTML=['todo','in_progress','done'].map(s=>{const items=tasks.filter(t=>s==='in_progress'?['in_progress','blocked'].includes(t.status):t.status===s);return '<div class="column"><h3>'+esc(status(s))+' <span class="tag">'+items.length+'</span></h3>'+items.map(t=>'<article class="task" id="task-'+esc(t.id)+'"><h3>'+esc(label(t))+'</h3><span class="tag '+esc(t.status)+'">'+esc(status(t.status))+'</span></article>').join('')+'</div>'}).join('');document.getElementById('empty').hidden=tasks.length>0}
function render(){const d=text[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';put('heading',d.heading);put('sideLabel',d.sideLabel);put('language',lang==='zh'?'EN':'中文');put('updated',d.updated+' · '+snapshot.updatedAt);[['navOverview','overview'],['navWork','work'],['navRoles','roles'],['navRecords','records'],['workTitle','work'],['rolesTitle','roles'],['recordsTitle','records'],['scopeTitle','scopeTitle'],['scope','scope'],['attentionTitle','attention'],['roleNotice','roleNotice'],['footer','footer'],['empty','empty']].forEach(([id,key])=>put(id,d[key]));const done=snapshot.tasks.filter(t=>t.status==='done').length;document.getElementById('metrics').innerHTML=[[d.total,snapshot.tasks.length],[d.done,done],[d.open,snapshot.tasks.length-done],[d.agents,snapshot.agents.length]].map(([s,n])=>'<div class="panel metric"><span>'+esc(s)+'</span><b>'+n+'</b></div>').join('');document.getElementById('completion').style.width=(snapshot.tasks.length?done/snapshot.tasks.length*100:0)+'%';put('completionText',done+'/'+snapshot.tasks.length+' · '+d.completion);document.getElementById('attention').innerHTML=snapshot.tasks.filter(t=>t.status!=='done').map(t=>'<p>'+esc(label(t))+' <span class="tag">'+esc(status(t.status))+'</span></p>').join('')||esc(d.none);document.getElementById('search').placeholder=d.search;document.getElementById('search').setAttribute('aria-label',d.search);const previous=document.getElementById('statusFilter').value;document.getElementById('statusFilter').innerHTML=['','todo','in_progress','blocked','done'].map(s=>'<option value="'+s+'">'+esc(s?status(s):d.all)+'</option>').join('');document.getElementById('statusFilter').value=previous;document.getElementById('statusFilter').setAttribute('aria-label',d.all);board();document.getElementById('agents').innerHTML=snapshot.agents.map(a=>'<article class="agent"><div class="role-head"><span class="avatar">'+esc(a.labels.en.split(' ')[0][0])+'</span><strong>'+esc(a.labels[lang])+'</strong></div><span class="tag">'+esc(status(a.status))+'</span><p>'+esc(a.labels[lang==='zh'?'scopeZh':'scopeEn'])+'</p><div class="small">'+esc(d.tasks)+'</div>'+a.taskIds.filter(id=>snapshot.tasks.some(t=>t.id===id)).map(id=>'<div>'+esc(label(snapshot.tasks.find(t=>t.id===id)))+'</div>').join('')+'</article>').join('');document.getElementById('recordList').innerHTML='<p class="small">'+esc(d.recordNote)+'</p>'+snapshot.tasks.map(t=>'<div class="record">'+esc(label(t))+' <span class="tag '+esc(t.status)+'">'+esc(status(t.status))+'</span></div>').join('')}
if(snapshot.projectKey!=='multistrat-cloud-2026-10-06'||snapshot.consoleVersion!=='multistrat-console-v3'||snapshot.startedAt!=='2026-10-06'){throw Error('Invalid current-project console payload')}
document.getElementById('language').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';render()});document.getElementById('search').addEventListener('input',board);document.getElementById('statusFilter').addEventListener('change',board);render();
</script></body></html>
