name: Deploy current project console
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate sole console source
        run: |
          python - <<'PY'
          import pathlib, json, re
          root = pathlib.Path('.')
          allowed = {'.github/workflows/pages.yml', '.nojekyll', 'LICENSE', 'README.md', 'index.html', 'web/index.html', 'projects/tracker-web/index.html'}
          files = {str(p) for p in root.rglob('*') if p.is_file() and '.git' not in p.parts}
          assert files == allowed, files ^ allowed
          page = pathlib.Path('index.html').read_text()
          assert 'multistrat-console-v3' in page
          match = re.search(r'const snapshot=(.*?);\nconst text=', page, re.S)
          data = json.loads(match.group(1))
          assert data['projectKey'] == 'multistrat-cloud-2026-10-06'
          assert data['consoleVersion'] == 'multistrat-console-v3'
          assert data['startedAt'] == '2026-10-06'
          assert data['updatedAt'] >= data['startedAt']
          assert {a['id'] for a in data['agents']} == {'coordinator','implementer','code_reviewer','research_validator'}
          assert not re.search(r'<script[^>]+src=', page)
          for old in ['今日回测次数','Runtime演示','平均夏普','QC 流水线','策略搜索引擎','Quant Project Tracker']:
              assert old not in page, old
          for path in ['web/index.html','projects/tracker-web/index.html']:
              assert 'location.replace' in pathlib.Path(path).read_text()
          PY
      - uses: actions/configure-pages@v5
      - name: Prepare validated console
        run: |
          mkdir _site
          cp -a index.html LICENSE .nojekyll projects web _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployed version matches source
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, pathlib, urllib.request, time
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          for attempt in range(12):
              try:
                  for path in ['index.html', 'web/index.html', 'projects/tracker-web/index.html']:
                      with urllib.request.urlopen(base + path + '?release=' + os.environ['GITHUB_SHA'], timeout=20) as response:
                          actual = response.read()
                      assert actual == pathlib.Path(path).read_bytes(), path
                      print('Verified live source:', path)
                  break
              except Exception:
                  if attempt == 11: raise
                  time.sleep(10)
          PY
