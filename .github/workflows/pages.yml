# Public summary release: 562473da8a73e8d36c9f36ede4e7b0e4a910ac34
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tracker-pages
      - uses: actions/configure-pages@v5
      - name: Prepare public summary only
        run: |
          mkdir -p _site
          cp index.html LICENSE .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
